function classify(t){t=String(t||"");let best="أخرى",n=0;for(const c in KW){const k=KW[c].filter(w=>t.includes(w)).length;if(k>n){n=k;best=c}}const u=URG.filter(w=>t.includes(w)).length;return{cat:best,pri:u>=2?"h":u==1?"h":"m",hit:n+u>0}}
async function ask(p,json){let sm=null;try{sm=window.claude?await claude.use("sample"):null}catch(e){}if(!sm)return null;try{return json?await sm.json(p):(await sm(p)).text}catch(e){return null}}

async function aiAnalyze(){const t=$("pr").value.trim();if(!t)return toast("اكتب المشكلة أولًا");toast("✨ جارٍ التحليل...");
 const r=await ask(`حلّل طلب صيانة لفرع مطعم وأعد JSON فقط بدون أي نص آخر بالشكل {"cat":"","pri":"h|m|l","tips":""}. cat واحدة من: ${CAT.join("، ")}. pri: h عاجل (خطر/توقف تشغيل)، m عادي، l منخفض. tips: نصيحة أمان أو إجراء سريع قصير بالعربية للفرع قبل وصول الفني. المشكلة: ${t}`,true);
 if(r&&CAT.includes(r.cat)){$("ct").value=r.cat;$("pp").value=PRI[r.pri]?r.pri:"m";$("ct").dataset.m=$("pp").dataset.m=1;$("ht").textContent="✨ "+(r.tips||"تم التحليل")}else{$("ct").dataset.m=$("pp").dataset.m="";hint();toast("تم التحليل المحلي")}}
async function tip(id){const r=reqs.find(x=>x.id==id),e=$("t"+id);e.className="ai";e.textContent="✨ جارٍ التفكير...";
 const a=await ask(`أنت فني صيانة خبير لفروع المطاعم. المشكلة: "${r.problem}" — التصنيف: ${r.cat||"غير محدد"} — سبب الفرع: ${r.cause||"غير مذكور"}. اكتب بالعربية وبإيجاز (5 أسطر كحد أقصى): السبب المحتمل، خطوات الفحص، الأدوات أو القطع المطلوبة، الوقت التقديري.`);
 e.textContent=a||"الذكاء الاصطناعي غير متاح حاليًا."}
function insights(list){const o=[],now=Date.now(),late=list.filter(r=>r.status=="pending"&&now-r.sentAt>864e5);
 if(late.length)o.push(`⏰ ${late.length} طلب معلّق لأكثر من 24 ساعة — أقدمها: ${late.sort((a,b)=>a.sentAt-b.sentAt)[0].branch}`);
 const g={};list.filter(r=>now-r.sentAt<2592e6).forEach(r=>{const k=r.branch+"|"+(r.cat||classify(r.problem).cat);g[k]=(g[k]||0)+1});
 Object.entries(g).filter(([k,v])=>v>=3).sort((a,b)=>b[1]-a[1]).slice(0,2).forEach(([k,v])=>{const[b,c]=k.split("|");o.push(`🔁 تكرار: ${c} في ${b} (${v} مرات خلال 30 يومًا) — يُنصح بفحص جذري`)});
 const u=list.filter(r=>r.status=="pending"&&r.pri=="h").length;if(u)o.push(`🚨 ${u} طلب عاجل بانتظار المعالجة`);

async function aiReport(){const b=bfilter?reqs.filter(r=>r.branch==bfilter):reqs,e=$("air");e.className="ai";e.textContent="✨ جارٍ إعداد التقرير...";

function dash(l){
 const all=reqs,now=Date.now(),t=l.length,dn=l.filter(r=>r.status=="done").length,p=t?Math.round(dn/t*100):0,C=2*Math.PI*44;

    try{
      firebase.initializeApp(FB);col=firebase.firestore().collection("requests");sync="shared";
      col.onSnapshot(s=>{reqs=s.docs.map(d=>({...d.data(),id:d.id}));softRender()},()=>{sync="err";render()});
    }catch(e){col=null;sync="err"}
    render()
  }else{
    sync="local";
    try{reqs=JSON.parse(localStorage.getItem("reqs")||"[]")}catch(e){reqs=[]}render()
  }
}
async function save(r){
  if(col){await col.doc(r.id).set(r)}
  else{reqs=reqs.filter(x=>x.id!==r.id).concat(r);try{localStorage.setItem("reqs",JSON.stringify(reqs))}catch(e){}render()}
}
function shrink(file){return new Promise(res=>{if(!file)return res("");const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,560/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.55))};im.onerror=()=>res("");im.src=fr.result};fr.readAsDataURL(file)})}

function hero(title,sub,out){return `<div class="hero"><div><h1>${title}</h1><small>${sub}</small></div>${out?`<button onclick="who=null;filter='all';bfilter='';q='';render()">خروج</button>`:""}</div>`}
function stats(list){const c=s=>list.filter(r=>r.status==s).length;return `<div class="stats"><div class="st"><b>${list.length}</b><span>الإجمالي</span></div><div class="st"><b style="color:var(--wr)">${c("pending")}</b><span>قيد الانتظار</span></div><div class="st"><b style="color:var(--ok)">${c("done")}</b><span>تمت</span></div><div class="st"><b style="color:var(--no)">${c("notdone")}</b><span>لم تتم</span></div></div>`}
function tabs(l){const c=k=>k=="all"?l.length:l.filter(r=>r.status==k).length;return `<div class="tabs">${[["all","📋 الكل"],["pending","⏳ قيد الانتظار"],["done","✅ تمت"],["notdone","⚠️ لم تتم"]].map(([k,t])=>`<button class="${filter==k?"":"g"}" onclick="filter='${k}';render()">${t}<b>${c(k)}</b></button>`).join("")}</div>`}
function empty(){return '<div class="empty"><b>📭</b>لا توجد طلبات هنا<br><span>ستظهر الطلبات فور إضافتها</span></div>'}
function steps(r){const p=r.status=="pending";return `<div class="steps"><div class="on">📨 أُرسل</div><div class="${p?"on":"ok"}">🔧 قيد المعالجة</div><div class="${p?"":r.status=="done"?"ok":"no"}">${p?"🏁 النتيجة":r.status=="done"?"✅ تمت الصيانة":"⚠️ لم تتم"}</div></div>`}

function render(){render0();$("app").insertAdjacentHTML("afterbegin",syncBar())}
function render0(){
  const a=$("app"),keep=document.activeElement&&document.activeElement.id=="sq";
  if(!who){
    const pend=b=>reqs.filter(r=>r.branch==b&&r.status=="pending").length;
    a.innerHTML=hero("🔧 نظام صيانة الفروع","إدارة طلبات الصيانة وتتبعها بسهولة")+`<div class="guide"><div><span>📝</span>اكتب المشكلة</div><div><span>📸</span>أرفق صورة</div><div><span>🔧</span>تابع الإصلاح</div></div>`+`<div class="card"><b>🏪 اختر فرعك للدخول</b><div class="m">لإرسال طلب صيانة ومتابعة حالته</div><div class="grid" style="margin-top:10px">${BR.map((b,i)=>`<button class="g" onclick="who={t:'b',n:BR[${i}]};render()">${b}${pend(b)?` <span class="tag w">${pend(b)}</span>`:""}</button>`).join("")}</div></div>
    <div class="card"><b>🛠 دخول مسؤول الصيانة</b><div class="m">لمعالجة الطلبات والاطلاع على التقارير</div><input id="pw" type="password" placeholder="كلمة المرور" onkeydown="if(event.key=='Enter')login()"><button onclick="login()" style="width:100%">دخول</button><div id="err" class="m" style="color:var(--no)"></div></div>`;return}
  if(who.t=="b"){
    const mine=reqs.filter(r=>r.branch==who.n).sort((x,y)=>y.sentAt-x.sentAt);
    const list=mine.filter(r=>filter=="all"||r.status==filter);
    a.innerHTML=hero("🏪 "+who.n,"لوحة الفرع",1)+stats(mine)+`<div class="card"><b>📝 طلب صيانة جديد</b><div class="m">اكتب المشكلة بوضوح وأرفق صورة إن أمكن — يصل الطلب للمسؤول فورًا</div>
    <div class="row"><select id="ct" onchange="this.dataset.m=1">${CAT.map(c=>`<option>${c}</option>`).join("")}</select><select id="pp" onchange="this.dataset.m=1"><option value="m">أولوية: عادي</option><option value="h">أولوية: عاجل</option><option value="l">أولوية: منخفض</option></select></div>
    <textarea id="pr" rows="3" placeholder="ما هي المشكلة؟" oninput="hint()"></textarea><div id="ht" class="m"></div>
    <textarea id="ca" rows="2" placeholder="سبب المشكلة (إن وجد)"></textarea>
    <input id="im" type="file" accept="image/*" capture="environment" onchange="prev(this)"><img id="pv" class="p" style="display:none">
    <div class="row" style="margin-top:6px"><button class="g" onclick="aiAnalyze()">✨ تحليل ذكي</button><button id="sb" onclick="send()">إرسال الطلب</button></div></div><h3>📋 طلباتي</h3>`+tabs(mine)+(list.map(r=>card(r)).join("")||empty());
  }else{
    const base=reqs.filter(r=>!bfilter||r.branch==bfilter);
    const all=base.filter(r=>(filter=="all"||r.status==filter)&&(!q||(r.problem+r.branch+(r.cat||"")).includes(q))).sort((x,y)=>(x.status=="pending"?0:1)-(y.status=="pending"?0:1)||({h:0,m:1,l:2}[x.pri||"m"]-{h:0,m:1,l:2}[y.pri||"m"])||y.sentAt-x.sentAt);
    const dn=base.filter(r=>r.doneAt&&r.status!="pending"),avg=dn.length?dn.reduce((s,r)=>s+r.doneAt-r.sentAt,0)/dn.length:0;
    a.innerHTML=hero("🛠 لوحة مسؤول الصيانة",greet()+" • متوسط زمن المعالجة: "+dur(avg),1)+dash(base)+`<div class="card"><b>💡 تنبيهات ذكية</b>${insights(base)}<div style="margin-top:10px"><b>📊 توزيع المشاكل</b>${chart(base)}</div><button class="g" onclick="aiReport()" style="width:100%;margin-top:8px">✨ تقرير ذكي بالذكاء الاصطناعي</button><div id="air"></div></div><div class="row"><select id="bf" onchange="bfilter=this.value;render()"><option value="">كل الفروع</option>${BR.map(b=>`<option ${bfilter==b?"selected":""}>${b}</option>`).join("")}</select><input id="sq" placeholder="🔍 بحث..." value="${esc(q)}" oninput="q=this.value;render()"></div>`+`<h3>📋 الطلبات (${all.length})</h3>`+tabs(base)+`<button class="g" onclick="csv()" style="width:100%;margin-bottom:10px">⬇️ تصدير Excel (CSV)</button>`+(all.map(r=>card(r,1)).join("")||empty());
    if(keep){const s=$("sq");s.focus();s.setSelectionRange(s.value.length,s.value.length)}
  }
}
function prev(i){const f=i.files[0],p=$("pv");if(!f){p.style.display="none";return}p.src=URL.createObjectURL(f);p.style.display="block"}
function card(r,m){
  const s=ST[r.status],pr=PRI[r.pri||"m"],im=u=>safeImg(u)?`<img class="p" onclick="zoom(this)" src="${safeImg(u)}">`:"";
  return `<div class="card s-${r.status}${r.status=="pending"&&r.pri=="h"?" urg":""}"><div class="top"><b>${esc(r.branch)}<span class="pri ${pr[1]}">${pr[0]}</span></b><span>${r.status=="pending"&&Date.now()-r.sentAt>864e5?'<span class="tag late">متأخر</span> ':""}<span class="tag ${s[1]}">${s[0]}</span></span></div>
  ${r.cat?`<span class="chip">${CI[r.cat]||"🏷"} ${esc(r.cat)}</span>`:""}${steps(r)}
  <p><b>المشكلة:</b> ${esc(r.problem)}</p>${r.cause?`<p><b>السبب:</b> ${esc(r.cause)}</p>`:""}${im(r.img)}
  <p class="m">أُرسل: ${fmt(r.sentAt)}<br>تمت المعالجة: ${fmt(r.doneAt)}${r.doneAt?` — استغرقت ${dur(r.doneAt-r.sentAt)}`:` — منذ ${dur(Date.now()-r.sentAt)}`}</p>
  ${r.status!="pending"?`<div class="fix"><p><b>سبب المشكلة (الصيانة):</b> ${esc(r.fixCause)}</p>${r.note?`<p><b>ملاحظة:</b> ${esc(r.note)}</p>`:""}${im(r.fixImg)}</div>`:""}
  ${m?(r.status=="pending"?`<button class="g" style="width:100%;margin-top:8px" onclick="tip('${r.id}')">💡 اقتراح ذكي للحل</button><div id="t${r.id}"></div><div id="f${r.id}"><select id="s${r.id}" onchange="sel('${r.id}')"><option value="">— اختر الحالة —</option><option value="done">إتمام المشكلة</option><option value="notdone">عدم إتمام المشكلة</option></select><div id="x${r.id}"></div></div>`:`<button onclick="pdf('${r.id}')" style="width:100%;margin-top:8px">📄 تحويل إلى PDF وإرسال</button>`):""}</div>`;
}
function login(){if($("pw").value===PASS){who={t:"m"};render()}else $("err").textContent="كلمة المرور غير صحيحة"}
async function send(){
  const p=$("pr").value.trim();if(!p)return toast("اكتب المشكلة أولًا");
  if(busy)return;busy=true;$("sb").disabled=true;$("sb").textContent="جارٍ الإرسال...";
  try{
    const img=await shrink($("im").files[0]);
    await save({id:"r"+Date.now()+Math.random().toString(36).slice(2,6),branch:who.n,cat:$("ct").value,pri:$("pp").value,problem:p,cause:$("ca").value.trim(),img,status:"pending",sentAt:Date.now(),doneAt:0});
    toast("✅ تم إرسال الطلب");render();
  }catch(e){toast("تعذر الإرسال، حاول مجددًا")}
  busy=false;
}
function sel(id){
  const v=$("s"+id).value,x=$("x"+id);
  if(!v){x.innerHTML="";return}
  x.innerHTML=`<textarea id="c${id}" rows="2" placeholder="${v=="done"?"سبب المشكلة":"سبب عدم الإتمام"}"></textarea>${v=="done"?'<label class="m">صورة بعد الإصلاح</label>':""}<input id="i${id}" type="file" accept="image/*" capture="environment"><textarea id="n${id}" rows="2" placeholder="ملاحظات (اختياري)"></textarea><button class="${v=="done"?"ok":"no"}" style="width:100%" onclick="fin('${id}','${v}')">حفظ</button>`;
}
async function fin(id,v){
  const r=reqs.find(x=>x.id==id),c=$("c"+id).value.trim();
  if(!c)return toast("اكتب السبب");
  try{const fixImg=await shrink($("i"+id).files[0]);
  await save({...r,status:v,fixCause:c,note:$("n"+id).value.trim(),fixImg,doneAt:Date.now()});toast("تم الحفظ ✅")}catch(e){toast("تعذر الحفظ")}
}
async function out(blob,name){
  let dl=null;try{dl=window.claude?await claude.use("downloads"):null}catch(e){}
  if(dl){await dl.save({filename:name,data:blob})}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click()}
}
function csv(){
  const rows=[["الفرع","التصنيف","الأولوية","المشكلة","الحالة","وقت الإرسال","وقت المعالجة","سبب الصيانة","ملاحظات"]].concat(reqs.filter(r=>!bfilter||r.branch==bfilter).map(r=>[r.branch,r.cat||"",PRI[r.pri||"m"][0],r.problem,ST[r.status][0],fmt(r.sentAt),fmt(r.doneAt),r.fixCause||"",r.note||""]));
  const t="\ufeff"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  out(new Blob([t],{type:"text/csv;charset=utf-8"}),"طلبات-الصيانة.csv").then(()=>toast("تم التصدير")).catch(()=>{})
}
async function pdf(id){
  const r=reqs.find(x=>x.id==id),s=ST[r.status][0],im=(u,t)=>safeImg(u)?`<p><b>${t}</b></p><img src="${safeImg(u)}" style="max-width:100%;max-height:240px">`:"";
  toast("جارٍ إنشاء التقرير...");
  $("rep").innerHTML=`<h2 style="text-align:center;border-bottom:3px solid #f5b800;padding-bottom:8px;margin-top:0">تقرير صيانة</h2>
  <p><b>الفرع:</b> ${esc(r.branch)} &nbsp;|&nbsp; <b>التصنيف:</b> ${esc(r.cat)||"—"} &nbsp;|&nbsp; <b>الأولوية:</b> ${PRI[r.pri||"m"][0]}</p><p><b>الحالة:</b> ${s}</p><p><b>المشكلة:</b> ${esc(r.problem)}</p><p><b>السبب (الفرع):</b> ${esc(r.cause)||"—"}</p>${im(r.img,"صورة المشكلة")}
  <p><b>وقت إرسال الطلب:</b> ${fmt(r.sentAt)}</p><p><b>وقت المعالجة:</b> ${fmt(r.doneAt)} (المدة: ${dur(r.doneAt-r.sentAt)})</p>
  <p><b>سبب المشكلة (الصيانة):</b> ${esc(r.fixCause)}</p><p><b>ملاحظات:</b> ${esc(r.note)||"—"}</p>${im(r.fixImg,"صورة بعد الصيانة")}
  <div style="text-align:center;font-size:9px;color:#888;margin-top:18px;border-top:1px solid #ddd;padding-top:6px">ابتكار وتطوير : عبدالإله فقيه</div>`;
  try{
    const cv=await html2canvas($("rep"),{scale:1.5,backgroundColor:"#fff"});
    const {jsPDF}=window.jspdf,d=new jsPDF("p","mm","a4"),w=190,h=cv.height*w/cv.width;
    d.addImage(cv.toDataURL("image/jpeg",.85),"JPEG",10,10,w,Math.min(h,277));
    const blob=d.output("blob"),name="صيانة-"+r.branch+".pdf";
    await out(blob,name);
    const f=new File([blob],name,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:name}).catch(()=>{});
  }catch(e){toast("تعذر إنشاء PDF")}
}
init();
</script></body></html>
